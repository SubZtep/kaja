[args]
help        = """
Kaja 命令列工具 • v{version} • https://kaja.io

用法
  $ kaja [OPTIONS] [COMMAND]

指令
  config <wizard|fetch|diff|paths>
                       互動式設定，或管理設定檔
  doctor               列出已設定的模型、MCP 伺服器和工具，並檢查連線
  telegram [--pair]    執行你的 Telegram 機器人；--pair 會顯示一組配對碼，讓再多一個人配對
  abilities [update]   選擇要載入哪些技能，或取得市集內容
  sessions             列出已儲存的本機工作階段及其 ID
  images [describe [--retry] | clean [--yes]]
                       顯示已儲存的圖片；描述沒有描述的圖片，或移除殘留項目（--local）
  login                登入雲端帳號，但不開始對話
  logout               登出雲端帳號，並清除已儲存的憑證

選項
  --local         用你自己的供應商執行本機代理迴圈，而不是登入雲端
  --cloud         即使有本機設定也強制登入雲端（預設）
  --continue, -c  繼續最近的工作階段（僅限 --local）
  --headless      不使用終端介面；用於支援此功能的子指令（例如 telegram）
  --session, -s   依 ID 繼續工作階段（僅限 --local；參見：kaja sessions）
  --help          顯示這份說明
  --version       顯示版本
"""
unknownFlag = "{message}。執行 `kaja --help` 查看可用的選項。"


