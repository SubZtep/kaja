[args]
help = """
Kaja 命令列工具 • v{version} • https://kaja.io

用法
  $ kaja [選項] [指令]

指令
  config <wizard|fetch|diff|paths>
                       以互動方式設定，或管理設定檔
  doctor               列出已設定的模型、MCP 伺服器與工具，並檢查連線
  telegram
  abilities [update]   選擇要載入的技能，或下載市集內容
  sessions             列出已儲存的本機對話及其 id
  logout               登出雲端帳號，並清除已儲存的憑證

選項
  --local         使用你自己的供應商執行本機代理，而非雲端登入
  --cloud         即使已有本機設定，也強制使用雲端登入（預設）
  --continue, -c  繼續最近一次的對話（僅限 --local）
  --headless      不顯示終端機介面；供支援的子指令使用（例如 telegram）
  --session, -s   依 id 繼續指定的對話（僅限 --local；參見：kaja sessions）
  --help          顯示此說明
  --version       顯示版本
"""
unknownFlag = "{message}。執行 `kaja --help` 查看可用的選項。"

[config]
invalidAt = "{path} 的設定檔無效：{message}"
notExists = "設定檔不存在：{path}"
usage = """
用法
  $ kaja config fetch   從伺服器下載設定檔（離線時使用內建範本）
  $ kaja config diff    顯示 fetch 會變更的內容，但不寫入任何檔案
  $ kaja config wizard  以互動方式設定語言、供應商與角色
  $ kaja config paths   列出 Kaja 讀取或寫入的所有路徑
"""
fetched = "已寫入 {path}"
fetchedWithBackup = "已寫入 {path}（舊檔已備份至 {backup}）"
