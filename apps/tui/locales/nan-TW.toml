[args]
help        = """
Kaja 命令列工具 • v{version} • https://kaja.io

用法
  $ kaja [OPTIONS] [COMMAND]

指令
  config <wizard|fetch|diff|paths>
                       互動式設定，抑是管理設定檔
  doctor               列出設定好个模型、MCP 伺服器佮工具，閣檢查連線
  telegram [--pair]    執行你个 Telegram 機器人；--pair 會顯示一組配對碼，予閣一个人配對
  abilities [update]   揀欲載入佗寡技能，抑是提市集个內容
  sessions             列出儲存好个本機工作階段佮怹个 ID
  images [describe [--retry] | clean [--yes]]
                       顯示儲存个圖；共無描述个圖描述，抑是提掉賰落來个物件（--local）
  login                登入雲端帳號，毋過無開始開講
  logout               登出雲端帳號，閣清掉儲存个憑證

選項
  --local         用你家己个供應商執行本機代理迴圈，毋免登入雲端
  --cloud         就算有本機設定嘛強制登入雲端（預設）
  --continue, -c  繼續上新个工作階段（干焦 --local）
  --headless      無終端介面；予有支援个子指令用（親像 telegram）
  --session, -s   照 ID 繼續工作階段（干焦 --local；請看：kaja sessions）
  --help          顯示這份說明
  --version       顯示版本
"""
unknownFlag = "{message}。執行 `kaja --help` 看有啥物選項通用。"


