[args]
help = """
Kaja 命令列工具 • v{version} • https://kaja.io

用法
  $ kaja [選項] [指令]

指令
  config <fetch|paths> 管理設定檔
  doctor               印出設定好个模型、MCP 伺服器佮工具，閣檢查連線
  telegram
  abilities [update]   揀欲載入个技能，抑是提市集
  sessions             列出存起來个本機工作階段佮伊的 id
  logout               登出雲端帳號，共儲存个憑證清掉

選項
  --local         用家己个供應商執行本機代理迴圈，代替雲端登入
  --cloud         強制用雲端登入，就算已經有本機設定嘛仝款（預設）
  --continue, -c  接落去上新个工作階段（干焦 --local 有效）
  --headless      無顯示終端機介面；用佇有支援這个模式个子指令（比如 telegram）
  --session, -s   用 id 接落去工作階段（干焦 --local 有效；看 kaja sessions）
  --help          顯示這个說明
  --version       印出版本
"""
unknownFlag = "{message}。執行 `kaja --help` 看有啥物選項通用。"

