providerOllama = "Ollama（本機，佇這台機器頂懸執行）"
providerLlama = "llama.cpp（本機，佇這台機器頂懸執行）"
providerSkip = "略過 — 我家己設定 models.toml"

[args]
help = """
Kaja 命令列工具 • v{version} • https://kaja.io

用法
  $ kaja [選項] [指令]

指令
  config <fetch|wipe|paths>  管理設定檔
  doctor                     印出設定好个模型、MCP 伺服器佮工具，閣檢查連線
  telegram
  logout                     登出託管（--remote）帳號，共儲存个憑證清掉

選項
  --local         用家己个供應商執行本機代理迴圈，代替託管登入
  --remote        強制用託管登入，就算已經有本機設定嘛仝款
  --continue, -c  接落去上新个工作階段（干焦 --local 有效）
  --headless      無顯示終端機介面；用佇有支援這个模式个子指令（比如 telegram）
  --session, -s   用 id 接落去工作階段（干焦 --local 有效；看 kaja --local session list）
"""

[config]
invalidAt = "設定檔無效（{path}）：{message}"
notExists = "設定檔無存在：{path}"
usage = """
用法
  $ kaja config fetch   對伺服器下載設定檔（若離線就用內建範本）
  $ kaja config diff    顯示 fetch 會改變啥物，毋寫入任何物件
  $ kaja config wizard  互動式設定：語言、供應商、人設
  $ kaja config wipe    先備份才共規个設定資料夾清空
  $ kaja config paths   印出 Kaja 讀寫个所有路徑
"""
fetched = "已經寫入 {path}"
fetchedWithBackup = "已經寫入 {path}（早前个檔案已經備份去 {backup}）"
fetchedUnchanged = "{path} 已經是上新版矣"
fetchAllUpToDate = "全部已經是上新版矣"
fetchOfflineFallback = "連袂著伺服器（{message}）— 改用內建範本"
