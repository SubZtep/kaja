[args]
help        = """
Ferramenta de linha de comando do Kaja • v{version} • https://kaja.io

USO
  $ kaja [OPÇÕES] [COMANDO]

COMANDOS
  config <wizard|fetch|diff|paths>
                       Configure de forma interativa ou gerencie os arquivos de configuração
  doctor               Mostra os modelos, servidores MCP e ferramentas configurados e verifica as conexões
  telegram [--pair]    Executa seu bot do Telegram; --pair mostra um código para parear mais uma pessoa
  abilities [update]   Escolha quais skills carregar, ou busque o marketplace
  sessions             Lista as sessões locais salvas com seus ids
  images [describe [--retry] | clean [--yes]]
                       Mostra as imagens guardadas; descreve as que não têm descrição, ou remove as sobras (--local)
  login                Entra na conta da nuvem sem iniciar um chat
  logout               Sai da conta da nuvem, apagando a credencial guardada

OPÇÕES
  --local         Executa o loop do agente local com seu próprio provedor, em vez do login na nuvem
  --cloud         Força o login na nuvem mesmo com uma configuração local (padrão)
  --continue, -c  Retoma a sessão mais recente (somente --local)
  --headless      Sem interface de terminal; para um subcomando compatível (ex.: telegram)
  --session, -s   Retoma uma sessão pelo id (somente --local; veja: kaja sessions)
  --help          Mostra esta ajuda
  --version       Mostra a versão
"""
unknownFlag = "{message}. Execute `kaja --help` para ver as opções disponíveis."


