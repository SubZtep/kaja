  $ kaja config diff    Mostra se o fetch mudaria o models.toml, sem gravar
  $ kaja config wizard  Configuração interativa de idioma, provedor e persona
  $ kaja config hooks   Configura sons, notificações e fala neste computador
  $ kaja config paths   Mostra todos os caminhos que o Kaja lê ou grava
"""
