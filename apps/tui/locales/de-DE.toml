[args]
help        = """
Kaja-Kommandozeilentool • v{version} • https://kaja.io

NUTZUNG
  $ kaja [OPTIONEN] [BEFEHL]

BEFEHLE
  config <wizard|fetch|diff|paths>
                       Interaktiv einrichten oder Konfigurationsdateien verwalten
  doctor               Konfigurierte Modelle, MCP-Server und Tools anzeigen und Verbindungen prüfen
  telegram [--pair]    Deinen Telegram-Bot starten; --pair zeigt einen Code, um eine weitere Person zu koppeln
  abilities [update]   Auswählen, welche Skills geladen werden, oder den Marketplace abrufen
  sessions             Gespeicherte lokale Sitzungen mit ihren IDs auflisten
  images [describe [--retry] | clean [--yes]]
                       Gespeicherte Bilder zeigen; die ohne Beschreibung beschreiben oder Reste entfernen (--local)
  login                Beim Cloud-Konto anmelden, ohne einen Chat zu starten
  logout               Vom Cloud-Konto abmelden und die gespeicherten Anmeldedaten löschen

OPTIONEN
  --local         Die lokale Agent-Schleife mit deinem eigenen Anbieter statt der Cloud-Anmeldung nutzen
  --cloud         Cloud-Anmeldung erzwingen, auch wenn eine lokale Konfiguration existiert (Standard)
  --continue, -c  Die letzte Sitzung fortsetzen (nur --local)
  --headless      Keine Terminal-Oberfläche; für einen Unterbefehl, der es unterstützt (z. B. telegram)
  --session, -s   Eine Sitzung über ihre ID fortsetzen (nur --local; siehe: kaja sessions)
  --help          Diese Hilfe anzeigen
  --version       Die Version ausgeben
"""
unknownFlag = "{message}. Führe `kaja --help` aus, um die verfügbaren Optionen zu sehen."


