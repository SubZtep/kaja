[args]
help        = """
Outil en ligne de commande Kaja • v{version} • https://kaja.io

UTILISATION
  $ kaja [OPTIONS] [COMMANDE]

COMMANDES
  config <wizard|fetch|diff|paths>
                       Configurer de façon interactive, ou gérer les fichiers de config
  doctor               Afficher les modèles, serveurs MCP et outils configurés, et vérifier les connexions
  telegram [--pair]    Lancer votre bot Telegram ; --pair affiche un code pour appairer une personne de plus
  abilities [update]   Choisir les skills à charger, ou récupérer le marketplace
  sessions             Lister les sessions locales enregistrées avec leurs ids
  images [describe [--retry] | clean [--yes]]
                       Afficher les images stockées ; décrire celles sans description, ou supprimer les restes (--local)
  login                Se connecter au compte cloud sans lancer de chat
  logout               Se déconnecter du compte cloud, en effaçant son identifiant stocké

OPTIONS
  --local         Lancer la boucle d'agent locale avec votre propre fournisseur au lieu de la connexion cloud
  --cloud         Forcer la connexion cloud même si une config locale existe (par défaut)
  --continue, -c  Reprendre la session la plus récente (--local uniquement)
  --headless      Sans interface terminal ; pour une sous-commande compatible (ex. telegram)
  --session, -s   Reprendre une session par id (--local uniquement ; voir : kaja sessions)
  --help          Afficher cette aide
  --version       Afficher la version
"""
unknownFlag = "{message}. Lancez `kaja --help` pour voir les options disponibles."


