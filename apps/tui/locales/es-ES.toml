[args]
help        = """
Herramienta de línea de comandos de Kaja • v{version} • https://kaja.io

USO
  $ kaja [OPCIONES] [COMANDO]

COMANDOS
  config <wizard|fetch|diff|paths>
                       Configura de forma interactiva o gestiona los archivos de configuración
  doctor               Muestra los modelos, servidores MCP y herramientas configurados, y comprueba las conexiones
  telegram [--pair]    Ejecuta tu bot de Telegram; --pair muestra un código para vincular a otra persona
  abilities [update]   Elige qué skills se cargan, o descarga el marketplace
  sessions             Lista las sesiones locales guardadas con sus ids
  images [describe [--retry] | clean [--yes]]
                       Muestra las imágenes guardadas; describe las que no tienen descripción, o elimina las sobrantes (--local)
  login                Inicia sesión en la cuenta en la nube sin abrir un chat
  logout               Cierra la sesión de la cuenta en la nube y borra su credencial guardada

OPCIONES
  --local         Ejecuta el agente local con tu propio proveedor en lugar del acceso a la nube
  --cloud         Fuerza el acceso a la nube aunque exista una configuración local (por defecto)
  --continue, -c  Retoma la sesión más reciente (solo con --local)
  --headless      Sin interfaz de terminal; para un subcomando compatible (p. ej. telegram)
  --session, -s   Retoma una sesión por id (solo con --local; ver: kaja sessions)
  --help          Muestra esta ayuda
  --version       Muestra la versión
"""
unknownFlag = "{message}. Ejecuta `kaja --help` para ver las opciones disponibles."


