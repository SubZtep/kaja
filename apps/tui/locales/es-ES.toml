notExists            = "El archivo de configuración no existe: {path}"
usage                = """
Uso
  $ kaja config fetch   Actualiza models.toml desde models.dev
  $ kaja config diff    Indica si fetch cambiaría models.toml, sin escribirlo
  $ kaja config wizard  Configuración interactiva de idioma, proveedor y persona
  $ kaja config hooks   Configura sonidos, notificaciones y voz en este equipo
  $ kaja config paths   Muestra todas las rutas que Kaja lee o escribe
"""
