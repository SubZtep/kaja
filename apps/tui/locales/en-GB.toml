providerSkip = "Skip — I'll set up models.toml myself"

[args]
help = """
Kaja command line tool • v{version} • https://kaja.io

USAGE
  $ kaja [OPTIONS] [COMMAND]

COMMANDS
  config <fetch|wipe|paths>  Manage config files
  doctor                     Print configured models, MCP servers and tools, and check connections
  telegram
  logout                     Log out of the hosted (--remote) account, clearing its stored credential

OPTIONS
  --local         Run the local agent loop against your own provider instead of hosted login
  --remote        Force hosted login even if a local config exists (default)
  --continue, -c  Resume the most recent session (--local only)
  --headless      No terminal UI; for a subcommand that supports it (e.g. telegram)
  --session, -s   Resume a session by id (--local only; see: kaja --local session list)
  --help          Show this help
  --version       Print the version
"""
unknownFlag = "{message}. Run `kaja --help` to see the available options."

[config]
invalidAt = "Invalid config file at {path}: {message}"
notExists = "Config file does not exist: {path}"
usage = """
Usage
  $ kaja config fetch   Download config files from the server (bundled templates if offline)
  $ kaja config diff    Show what fetch would change, without writing anything
  $ kaja config wizard  Interactive setup for language, provider, and persona
  $ kaja config wipe    Back up and clear the whole config directory
  $ kaja config paths   Print every path Kaja reads or writes
"""
fetched = "Wrote {path}"
fetchedWithBackup = "Wrote {path} (previous file backed up to {backup})"
fetchedUnchanged = "{path} is already up to date"
fetchAllUpToDate = "All up to date"
fetchOfflineFallback = "Could not reach the server ({message}) — falling back to bundled templates"
wiped = "Moved {path} to {backup}"
