[args]
help = """
Kaja command line tool • v{version} • https://kaja.io

USAGE
  $ kaja [OPTIONS] [COMMAND]

COMMANDS
  config <fetch|paths> Manage config files
  doctor               Print configured models, MCP servers and tools, and check connections
  telegram
  pkg [update]         Pick which skills load, or fetch the marketplace
  logout               Log out of the cloud account, clearing its stored credential

OPTIONS
  --local         Run the local agent loop against your own provider instead of cloud login
  --cloud         Force cloud login even if a local config exists (default)
  --continue, -c  Resume the most recent session (--local only)
  --headless      No terminal UI; for a subcommand that supports it (e.g. telegram)
  --session, -s   Resume a session by id (--local only; see: kaja --local session list)
  --help          Show this help
  --version       Print the version
"""
unknownFlag = "{message}. Run `kaja --help` to see the available options."

