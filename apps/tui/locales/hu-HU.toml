[args]
help        = """
Kaja parancssori eszköz • v{version} • https://kaja.io

HASZNÁLAT
  $ kaja [OPTIONS] [COMMAND]

PARANCSOK
  config <wizard|fetch|diff|paths>
                       Interaktív beállítás, vagy a konfigurációs fájlok kezelése
  doctor               Kiírja a beállított modelleket, MCP-szervereket és eszközöket, és ellenőrzi a kapcsolatokat
  telegram [--pair]    Elindítja a Telegram-botodat; a --pair kódot mutat egy újabb személy párosításához
  abilities [update]   Válaszd ki, mely képességek töltődjenek be, vagy töltsd le a piacteret
  sessions             Kilistázza a mentett helyi munkameneteket az azonosítóikkal
  images [describe [--retry] | clean [--yes]]
                       A tárolt képek megjelenítése; leírás nélküliek leírása vagy a maradványok törlése (--local)
  login                Bejelentkezés a felhőfiókba csevegés indítása nélkül
  logout               Kijelentkezés a felhőfiókból, a tárolt hitelesítő adat törlésével

OPCIÓK
  --local         A helyi ágenshurok futtatása a saját szolgáltatóddal felhős bejelentkezés helyett
  --cloud         Felhős bejelentkezés kényszerítése akkor is, ha van helyi konfiguráció (alapértelmezett)
  --continue, -c  A legutóbbi munkamenet folytatása (csak --local)
  --headless      Terminálfelület nélkül; az ezt támogató alparancsokhoz (pl. telegram)
  --session, -s   Munkamenet folytatása azonosító alapján (csak --local; lásd: kaja sessions)
  --help          Ez a súgó
  --version       A verzió kiírása
"""
unknownFlag = "{message}. Futtasd a `kaja --help` parancsot az elérhető opciókért."


