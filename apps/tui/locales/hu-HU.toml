[args]
help = """
Kaja parancssoros felület • v{version} • https://kaja.io

HASZNÁLAT
  $ kaja [OPCIÓK] [PARANCS]

PARANCSOK
  config <fetch|paths> Konfigurációs fájlok kezelése
  doctor               Beállított modellek, MCP szerverek és eszközök kiírása, kapcsolatok ellenőrzése
  telegram
  pkg [update]         Betöltendő készségek kiválasztása, vagy a piactér letöltése
  logout               Kijelentkezés a felhő alapú fiókból, a tárolt hitelesítő adat törlésével

OPCIÓK
  --local         A helyi ágens futtatása saját szolgáltatóval a felhő alapú bejelentkezés helyett
  --cloud         Felhő alapú bejelentkezés kényszerítése akkor is, ha van helyi konfiguráció (alapértelmezett)
  --continue, -c  A legutóbbi munkamenet folytatása (csak --local esetén)
  --headless      Nincs terminál felület; ezt támogató alparancshoz (pl. telegram)
  --session, -s   Munkamenet folytatása azonosító alapján (csak --local esetén; lásd: kaja --local session list)
  --help          Ennek a súgónak a megjelenítése
  --version       A verziószám kiírása
"""
unknownFlag = "{message}. Futtasd a `kaja --help` parancsot az elérhető opciókért."

[config]
