usage                = """
Használat
  $ kaja config fetch   Letölti a konfigurációs fájlokat a szerverről (offline: beépített sablonok)
  $ kaja config diff    Megmutatja, mit változtatna a fetch, írás nélkül
  $ kaja config wizard  Interaktív beállítás: nyelv, szolgáltató, perszóna
  $ kaja config paths   Mutatja az összes elérési utat, amit a Kaja használ
"""
