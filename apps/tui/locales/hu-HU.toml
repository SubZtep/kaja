Használat
  $ kaja config fetch   A models.toml frissítése a models.dev alapján
  $ kaja config diff    Megmutatja, változtatna-e a fetch a models.toml-on, írás nélkül
  $ kaja config wizard  Interaktív beállítás: nyelv, szolgáltató és persona
  $ kaja config hooks   Hangok, értesítések és felolvasás beállítása ezen a gépen
  $ kaja config paths   Kiírja az összes útvonalat, amit a Kaja olvas vagy ír
"""
