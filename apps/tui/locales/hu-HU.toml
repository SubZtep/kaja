[args]
help        = """
Kaja parancssori eszköz • v{version} • https://kaja.io

HASZNÁLAT
  $ kaja [KAPCSOLÓK] [PARANCS]

PARANCSOK
  config <wizard|fetch|diff|paths>
                       Interaktív beállítás vagy a konfigurációs fájlok kezelése
  doctor               A beállított modellek, MCP-szerverek és eszközök kiírása, a kapcsolatok ellenőrzése
  telegram [--pair]    A Telegram-botod futtatása; a --pair kódot ad egy újabb ember párosításához
  abilities [update]   A képességeid és az őket használó personák listája, vagy a piactér letöltése
  sessions             A mentett helyi munkamenetek listája az azonosítóikkal
  images [describe [--retry] | clean [--yes]]
                       A tárolt képek megjelenítése; a leírás nélküliek leírása vagy a maradványok törlése (--local)
  login                Bejelentkezés a felhőfiókba beszélgetés indítása nélkül
  logout               Kijelentkezés a felhőfiókból, a tárolt hitelesítő adat törlésével

KAPCSOLÓK
  --local         A helyi ügynök futtatása a saját szolgáltatóddal, felhős bejelentkezés helyett
  --cloud         Felhős bejelentkezés akkor is, ha van helyi konfiguráció (alapértelmezett)
  --continue, -c  A legutóbbi munkamenet folytatása (csak --local)
  --headless      Terminálfelület nélkül; csak az ezt támogató alparancsokhoz (pl. telegram)
  --session, -s   Munkamenet folytatása azonosító alapján (csak --local; lásd: kaja sessions)
  --help          A súgó megjelenítése
  --version       A verzió kiírása
"""
unknownFlag = "{message}. A `kaja --help` megmutatja az elérhető kapcsolókat."


