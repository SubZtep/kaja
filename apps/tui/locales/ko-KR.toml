[args]
help        = """
Kaja 명령줄 도구 • v{version} • https://kaja.io

USAGE
  $ kaja [OPTIONS] [COMMAND]

COMMANDS
  config <wizard|fetch|diff|paths>
                       대화형으로 설정하거나 설정 파일을 관리합니다
  doctor               설정된 모델, MCP 서버, 도구를 출력하고 연결을 확인합니다
  telegram [--pair]    Telegram 봇을 실행합니다. --pair는 한 명을 더 연결할 코드를 보여 줍니다
  abilities [update]   불러올 스킬을 고르거나 마켓플레이스를 가져옵니다
  sessions             저장된 로컬 세션을 id와 함께 나열합니다
  images [describe [--retry] | clean [--yes]]
                       저장된 이미지를 보여 줍니다. 설명 없는 이미지에 설명을 달거나 남은 파일을 지웁니다 (--local)
  login                채팅을 시작하지 않고 클라우드 계정에 로그인합니다
  logout               클라우드 계정에서 로그아웃하고 저장된 자격 증명을 지웁니다

OPTIONS
  --local         클라우드 로그인 대신 내 provider로 로컬 에이전트 루프를 실행합니다
  --cloud         로컬 설정이 있어도 클라우드 로그인을 강제합니다 (기본값)
  --continue, -c  가장 최근 세션을 이어갑니다 (--local 전용)
  --headless      터미널 UI 없음. 지원하는 하위 명령용 (예: telegram)
  --session, -s   id로 세션을 이어갑니다 (--local 전용, kaja sessions 참고)
  --help          이 도움말을 보여 줍니다
  --version       버전을 출력합니다
"""
unknownFlag = "{message}. 사용 가능한 옵션은 `kaja --help`로 확인하세요."


