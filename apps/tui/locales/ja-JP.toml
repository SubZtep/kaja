  $ kaja config diff    fetch で models.toml が変わるかを、書き込まずに表示
  $ kaja config wizard  言語、プロバイダー、ペルソナの対話式セットアップ
  $ kaja config hooks   このコンピューターの効果音、通知、音声読み上げを設定
  $ kaja config paths   Kajaが読み書きするすべてのパスを表示
"""
