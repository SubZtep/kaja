[args]
help        = """
Kaja コマンドラインツール • v{version} • https://kaja.io

使い方
  $ kaja [OPTIONS] [COMMAND]

コマンド
  config <wizard|fetch|diff|paths>
                       対話形式のセットアップ、または設定ファイルの管理
  doctor               設定済みのモデル、MCPサーバー、ツールを表示し、接続を確認
  telegram [--pair]    Telegramボットを起動。--pair でもう1人をペアリングするコードを表示
  abilities [update]   読み込むスキルを選択、またはマーケットプレイスを取得
  sessions             保存済みのローカルセッションをIDつきで一覧表示
  images [describe [--retry] | clean [--yes]]
                       保存済みの画像を表示。説明のない画像の説明を生成、または不要なものを削除(--local)
  login                チャットを始めずにクラウドアカウントへサインイン
  logout               クラウドアカウントからログアウトし、保存済みの認証情報を消去

オプション
  --local         クラウドログインではなく、自分のプロバイダーでローカルのエージェントループを実行
  --cloud         ローカル設定があってもクラウドログインを強制(デフォルト)
  --continue, -c  直近のセッションを再開(--local のみ)
  --headless      ターミナルUIなし。対応するサブコマンド用(例: telegram)
  --session, -s   IDを指定してセッションを再開(--local のみ。kaja sessions を参照)
  --help          このヘルプを表示
  --version       バージョンを表示
"""
unknownFlag = "{message}。`kaja --help` で利用可能なオプションを確認してください。"


