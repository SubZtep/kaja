[cli]
invalidConfig = "Invalid config file: {path}"
startupError = "Kaja hit an unexpected error and couldn't start: {message}\nDetails were written to the log file."
bye = "Bye, bye!"
localNoProvider = "--local needs a configured provider. Run `kaja --local` again and choose Fireworks/Ollama, or run `kaja --local config fetch`. For hosted chat instead, run `kaja --remote`."
headlessNoSubcommand = "--headless needs a subcommand that supports it, like `telegram`. There's no bare headless mode yet."
pleaseSignIn = "Please sign in!"
deviceLoginGoTo = "Go to:"
deviceLoginEnterCode = "Enter code:"

[firstRun]
paths = "Kaja will use these paths:"
intro = "Welcome to Kaja! Which provider would you like to use?"
providerFireworks = "Fireworks (cloud, needs an API key)"
providerOllama = "Ollama (local, runs on this machine)"
providerSkip = "Skip — I'll set up models.toml myself"

[args]
help = """
Kaja command like tool • https://kaja.io

USAGE
  $ kaja [OPTIONS] [COMMAND]

COMMANDS
  config fetch
  config wipe
  telegram
  web
  memory <list|forget <key-or-glob>|export>
  session <list|diagram <id>>

OPTIONS
  --local         Run the local agent loop against your own provider instead of hosted login
  --remote        Force hosted login even if a local config exists
  --continue, -c  Resume the most recent session (--local only)
  --session, -s   Resume a session by id (--local only; see: kaja --local session list)
  --headless      No terminal UI; for a subcommand that supports it (e.g. telegram)
  --paths         Print every path Kaja reads or writes
  --port          Port for kaja --local web (default: 4880)
  --help          Print this help
  --version       Print app version

EXAMPLES
  $ kaja
  $ kaja --local -c
  $ kaja --paths
  $ kaja --local config fetch
  $ kaja --local --headless telegram
"""

[memory]
usage = """
Usage
  $ kaja memory list                   List every stored note
  $ kaja memory forget <key-or-glob>   Delete notes by key, or in bulk with a glob like "test:*"
  $ kaja memory export                 Print the raw memory JSON
"""
empty = "(no notes stored)"
noMatch = "(no matching notes)"
forgot = "Forgot: {keys}"

[session]
usage = """
Usage
  $ kaja session list           List past sessions (newest first)
  $ kaja session diagram <id>   Print a session as a mermaid sequence diagram
"""
empty = "(no sessions recorded)"
none = "No session to continue"
notFound = "Session not found: {id}"

