notExists = "設定檔不存在：{path}"
usage = """
用法
  $ kaja config fetch   從內建範本重新產生設定檔
  $ kaja config wipe    備份並清空整個設定目錄
  $ kaja config paths   印出 Kaja 讀寫的所有路徑
"""
fetched = "已寫入 {path}"
fetchedWithBackup = "已寫入 {path}（先前的檔案已備份至 {backup}）"
