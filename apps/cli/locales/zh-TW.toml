logoutNotSignedIn = "{email} 尚未登入。"
logoutNoUser = "沒有可登出的託管帳號 — 請先用 `kaja --remote` 登入，或加上 --user <email> 參數。"

[firstRun]
paths = "Kaja 將使用以下路徑："
intro = "歡迎使用 Kaja！你想使用哪個供應商？"
