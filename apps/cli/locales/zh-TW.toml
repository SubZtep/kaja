providerOllama = "Ollama（本機，於此機器上執行）"
providerLlama = "llama.cpp（本機，於此機器上執行）"
providerSkip = "略過 — 我自己設定 models.toml"

[args]
help = """
Kaja 命令列工具 • v{version} • https://kaja.io

用法
  $ kaja [選項] [指令]

指令
  config <fetch|wipe|paths>  管理設定檔
  telegram
  web
  memory <list|forget <鍵值或萬用字元>|export>
  session <list|diagram <id>>
  logout                     登出託管（--remote）帳號並清除儲存的憑證

選項
  --local         使用自己的供應商執行本機代理迴圈，取代託管登入
  --remote        強制使用託管登入，即使已有本機設定
  --continue, -c  繼續最近的工作階段（僅限 --local）
  --headless      不顯示終端機介面；用於支援此模式的子指令（例如 telegram）
  --port          kaja --local web 使用的連接埠（預設：4880）
  --user          以電子郵件選擇/切換託管（--remote）帳號
  --session, -s   以 id 繼續工作階段（僅限 --local；參見 kaja --local session list）
  --lang          覆寫本次執行的介面/回覆語言（en、hu 或 zh-TW），不受已儲存設定影響
"""

[memory]
usage = """
用法
  $ kaja memory list                   列出所有已儲存的筆記
  $ kaja memory forget <鍵值或萬用字元>   依鍵值刪除筆記，或用萬用字元（如 "test:*"）批次刪除
  $ kaja memory export                 印出原始筆記 JSON
"""
empty = "（沒有已儲存的筆記）"
noMatch = "（沒有符合的筆記）"
forgot = "已刪除：{keys}"

[session]
usage = """
用法
  $ kaja session list           列出過往的工作階段（最新在前）
  $ kaja session diagram <id>   以 mermaid 循序圖印出工作階段
"""
empty = "（沒有已記錄的工作階段）"
none = "沒有可繼續的工作階段"
notFound = "找不到工作階段：{id}"

