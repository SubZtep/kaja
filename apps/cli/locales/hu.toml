[cli]
invalidConfig = "Érvénytelen konfigurációs fájl: {path}"
startupError = "Váratlan hiba történt, a Kaja nem tudott elindulni: {message}\nA részletek a naplófájlba kerültek."
bye = "Pá, pá!"
localNoProvider = "A --local kapcsolóhoz beállított szolgáltató szükséges. Futtasd újra a `kaja --local` parancsot és válaszd a Fireworks/Ollama opciót, vagy futtasd a `kaja --local config fetch` parancsot. Hosztolt csevegéshez futtasd a `kaja --remote` parancsot."
headlessNoSubcommand = "A --headless kapcsolóhoz ezt támogató alparancs szükséges, például `telegram`. Önálló headless mód még nem létezik."
pleaseSignIn = "Kérlek jelentkezz be!"
deviceLoginGoTo = "Nyisd meg:"
deviceLoginEnterCode = "Add meg a kódot:"

[firstRun]
paths = "A Kaja ezeket az elérési utakat fogja használni:"
intro = "Üdv a Kajában! Melyik szolgáltatót szeretnéd használni?"
providerFireworks = "Fireworks (felhő, API kulcs szükséges)"
providerOllama = "Ollama (helyi, ezen a gépen fut)"
providerSkip = "Kihagyás — magam állítom be a models.toml fájlt"

[args]
help = """
Kaja parancssoros felület • https://kaja.io

HASZNÁLAT
  $ kaja [OPCIÓK] [PARANCS]

PARANCSOK
  config fetch
  config wipe
  telegram
  web
  memory <list|forget <kulcs-vagy-glob>|export>
  session <list|diagram <id>>

OPCIÓK
  --local         A helyi ágens futtatása saját szolgáltatóval a hosztolt bejelentkezés helyett
  --remote        Hosztolt bejelentkezés kényszerítése akkor is, ha van helyi konfiguráció
  --continue, -c  A legutóbbi munkamenet folytatása (csak --local esetén)
  --session, -s   Munkamenet folytatása azonosító alapján (csak --local esetén; lásd: kaja --local session list)
  --headless      Nincs terminál felület; ezt támogató alparancshoz (pl. telegram)
  --paths         Mutatja az összes elérési utat, amit a Kaja használ
  --port          A kaja --local web portja (alapértelmezés: 4880)
  --help          Mutatja ezt a súgót
  --version       Mutatja az app verziót

PÉLDÁK
  $ kaja
  $ kaja --local -c
  $ kaja --paths
  $ kaja --local config fetch
  $ kaja --local --headless telegram
"""

[memory]
usage = """
Használat
  $ kaja memory list                    Kilistázza az összes elmentett jegyzetet
  $ kaja memory forget <kulcs-vagy-glob>  Jegyzetek törlése kulcs alapján, vagy csoportosan glob mintával, pl. "test:*"
  $ kaja memory export                  Mutatja a nyers memória JSON-t
"""
empty = "(nincs elmentett jegyzet)"
noMatch = "(nincs egyező jegyzet)"
forgot = "Elfelejtve: {keys}"

[session]
usage = """
Használat
  $ kaja session list           Kilistázza a korábbi munkameneteket (legújabb elöl)
  $ kaja session diagram <id>   Kiír egy munkamenetet mermaid szekvenciadiagramként
"""
empty = "(nincs elmentett munkamenet)"
none = "Nincs folytatható munkamenet"
notFound = "Nincs ilyen munkamenet: {id}"

[config]
invalidAt = "Érvénytelen konfigurációs fájl ({path}): {message}"
notExists = "Nem létezik a konfigurációs fájl: {path}"
usage = """
Használat
  $ kaja config fetch   Újragenerálja a konfigurációs fájlokat a beépített sablonokból
  $ kaja config wipe    Biztonsági mentés után törli a teljes konfigurációs könyvtárat
"""
fetched = "{path} elmentve"
fetchedWithBackup = "{path} elmentve (a korábbi fájl mentve ide: {backup})"
fetchedUnchanged = "{path} már naprakész"
wiped = "{path} áthelyezve ide: {backup}"
