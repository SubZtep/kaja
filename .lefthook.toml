[commit-msg]
  [[commit-msg.jobs]]
  run = "bun commitlint --edit {1}"


[pre-commit]
piped = true


  [[pre-commit.jobs]]
  name = "generate"


    [pre-commit.jobs.group]
    parallel = true


      [[pre-commit.jobs.group.jobs]]
      run  = "bun generate:schemas && git add packages/schema/json"
      glob = [
        "packages/schema/config/*.ts",
        "packages/schema/abilities/*.ts"
      ]


      [[pre-commit.jobs.group.jobs]]
      run  = "bun generate:env && bun generate:env-types && git add apps/api/.env.example apps/web/.env.example apps/sandbox/.env.example apps/api/src/env.d.ts apps/web/src/env.d.ts apps/tui/src/env.d.ts apps/sandbox/src/env.d.ts"
      glob = [
        "packages/schema/env/*.ts",
        "**/.env.example",
        "compose.yaml",
        "apps/*/disco.json"
      ]


      [[pre-commit.jobs.group.jobs]]
      run  = "bun sync:locales --stage"
      glob = [
        "apps/tui/locales/en-GB.toml",
        "apps/api/locales/en-GB.toml",
        "apps/web/messages/en-GB.json",
        "packages/shared/locale/index.ts"
      ]


      [[pre-commit.jobs.group.jobs]]
      run  = "bun run --filter @kaja/web generate:routes && git add apps/web/src/routeTree.gen.ts"
      glob = [
        "apps/web/src/routes/**",
        "apps/web/src/routeTree.gen.ts"
      ]


  [[pre-commit.jobs]]
  name = "check"


    [pre-commit.jobs.group]
    parallel = true


      [[pre-commit.jobs.group.jobs]]
      run         = "bun lint --fix --staged && bun fmt --staged"
      stage_fixed = true


      [[pre-commit.jobs.group.jobs]]
      run         = "tombi format {staged_files} && tombi lint --error-on-warnings {staged_files}"
      glob        = "*.toml"
      stage_fixed = true


      [[pre-commit.jobs.group.jobs]]
      run  = "bun typecheck"
      glob = "{*.{ts,tsx},**/tsconfig.json}"


[post-merge]
  [[post-merge.jobs]]
  run = "git diff --quiet ORIG_HEAD HEAD -- .lefthook.toml || lefthook install"


[pre-push]
piped = true


  [[pre-push.jobs]]
  name = "check"


    [pre-push.jobs.group]
    parallel = true


      [[pre-push.jobs.group.jobs]]
      run = "bun lint"


      [[pre-push.jobs.group.jobs]]
      run = "bun fmt --check"


      [[pre-push.jobs.group.jobs]]
      run = "tombi format --check && tombi lint --error-on-warnings"


      [[pre-push.jobs.group.jobs]]
      run  = "bun typecheck"
      glob = "{*.{ts,tsx},**/tsconfig.json}"


      [[pre-push.jobs.group.jobs]]
      run = "bun check:env && bun check:locales"


      [[pre-push.jobs.group.jobs]]
      run = "bun test"


        [[pre-push.jobs.group.jobs.only]]
        ref = "main"


  [[pre-push.jobs]]
  run       = "scripts/translate_push.sh {1}"
  use_stdin = true
