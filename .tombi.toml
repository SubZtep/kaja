toml-version = "v1.1.0"

# Schemas are generated from @kaja/schema's Zod schemas — run `bun generate:schemas`
# after changing packages/schema/config/*.ts or packages/schema/abilities/*.ts.
# The TUI's own config files are matched by their real path (Linux, macOS, Windows), not through the .user-config
# link: Tombi resolves symlinks before matching, so a **/.user-config/… pattern never matches.


[format]
  [format.rules]
  indent-sub-tables               = true
  key-value-equals-sign-alignment = true
  line-width                      = 1         # all array items on new lines
  string-quote-style              = "double"
  table-blank-lines               = 2
  trailing-comment-alignment      = true


[[schemas]]
path    = "packages/schema/json/commands.json"
include = [
  "**/.config/kaja*/commands.toml",
  "**/Library/Preferences/kaja*/commands.toml",
  "**/kaja*/Config/commands.toml",
  "**/.config/kaja*/commands.bak*.toml",
  "**/Library/Preferences/kaja*/commands.bak*.toml",
  "**/kaja*/Config/commands.bak*.toml"
]


