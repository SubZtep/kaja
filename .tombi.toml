toml-version = "v1.1.0"

# Schemas are generated from @kaja/schema's Zod schemas — run `bun generate:schemas`
# after changing packages/schema/config/*.ts, packages/schema/abilities/*.ts or packages/schema/cli/datasets.ts.


[format]
  [format.rules]
  indent-sub-tables               = true
  key-value-equals-sign-alignment = true
  line-width                      = 1         # all array items on new lines
  string-quote-style              = "double"
  table-blank-lines               = 2
  trailing-comment-alignment      = true


[[schemas]]
path    = "docs/config/schemas/commands.json"
include = [
  "docs/config/commands.toml",
  "**/.config/kaja/commands.toml",
  "**/.config/kaja/commands.bak*.toml"
]


[[schemas]]
path    = "docs/config/schemas/catalog.json"
include = [
  "docs/config/catalog.toml"
]


[[schemas]]
path    = "docs/config/schemas/http-tool.json"
include = [
  "marketplace/abilities/*/tool.toml",
  "**/.config/kaja/marketplace/abilities/*/tool.toml"
]


[[schemas]]
path    = "docs/config/schemas/mcp-ability.json"
include = [
  "marketplace/abilities/*/mcp.toml",
  "**/.config/kaja/marketplace/abilities/*/mcp.toml"
]


[[schemas]]
path    = "docs/config/schemas/models.json"
include = [
  "docs/config/models*.toml",
  "**/.config/kaja/models.toml",
  "**/.config/kaja/models.bak*.toml"
]


[[schemas]]
path    = "docs/config/schemas/persona.json"
include = [
  "marketplace/personas/*.toml",
  "**/.config/kaja/marketplace/personas/*.toml"
]


[[schemas]]
path    = "docs/config/schemas/secrets.json"
include = [
  "docs/config/secrets.toml",
  "**/.config/kaja/secrets.toml",
  "**/.config/kaja/secrets.bak*.toml"
]


[[schemas]]
path    = "docs/config/schemas/settings.json"
include = [
  "docs/config/settings.toml",
  "**/.config/kaja/settings.toml",
  "**/.config/kaja/settings.bak*.toml"
]
