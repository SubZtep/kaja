# Abilities Kaja loads in local mode. Abilities live in the marketplace/ folder
# next to this file: both the ones `kaja abilities update` syncs from the Kaja repo
# and your own. Only what is listed here is loaded, your own skills included.

# Skills, by folder name: marketplace/abilities/<name>/SKILL.md
skills = [

]

# HTTP tool abilities, by folder name: marketplace/abilities/<name>/tool.toml
tools = [

]

# MCP server abilities, by folder name: marketplace/abilities/<name>/mcp.toml
mcp = [

]

# Personas, by file name: marketplace/personas/<id>.toml. "default" always
# loads (built in unless you have a default.toml), so it needn't be listed.
personas = [

]

# Tools to leave out, by ability name; the rest (and any it gains later) stay on.
# `kaja abilities` asks about these too. An MCP ability needs a `tools` list for it.
# [disabledTools]
# chrome-devtools = ["click", "fill"]

# Where `kaja abilities update` fetches the marketplace from. Defaults to the Kaja
# repo's main branch; a local path works too, for testing your own changes.
# [source]
# url = "https://github.com/SubZtep/kaja.git"
# ref = "main"
