# External service config — each section is optional; skip a section to
# leave that feature off. Credentials for these same sections live in
# secrets.toml, not here.

# Kaja server used by `kaja config fetch`/`diff`/`wizard` to download the
# admin-managed defaults (personas, models, MCP servers). No token needed —
# GET /config/export is public.
[api]
baseUrl = "https://api.kaja.io"

# Geo lookup for the location tool.
[location]
serviceUrl = "https://ip2geo.demo.land"

# Telegram bot: message it to chat with Kaja outside the terminal.
# allowedUserIds gates who the bot will respond to and must be non-empty.
# [telegram]
# allowedUserIds = [123456789]
