# Kaja models — each model picks a [providers.*] table with `provider =
# "<name>"`; models that don't name one fall back to whichever provider has
# `default = true`. `model` is the literal name sent to the provider's API,
# and settings.json's models.<task> stores that model/provider pair directly
# (see the docs site). Provider API keys live in secrets.toml's
# [providers.<name>] tables, keyed the same way — Ollama requires one but
# ignores its value, e.g. [providers.ollama] api_key = "ollama".

[providers.ollama]
default = true
base_url = "http://localhost:11434/v1"

[[models]]
model = "llama3.2:1b"
task = "chat"

[[models]]
model = "qwen2.5:0.5b"
task = "chat"

[[models]]
model = "qwen3:1.7b"
task = "chat"

[[models]]
model = "llama3.2:3b"
task = "chat"

[[models]]
model = "nomic-embed-text"
task = "embedding"
