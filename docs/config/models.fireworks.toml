# Kaja models — [models.<task>] entries each pick a [providers.*] table with
# `provider = "<name>"`. The id must match the task name (e.g. "chat"); a
# persona's [models].<task> can pin a different model id if one exists.
# `model` is the literal name sent to the provider's API. Provider API keys
# live in secrets.toml's [providers.<name>] tables, keyed the same way.

[providers.fireworks]
base_url = "https://api.fireworks.ai/inference/v1"

[providers.speaches]
base_url = "http://localhost:8000"  # local server, no key needed

[providers.xai]
base_url = "https://api.x.ai/v1"

[models.chat]
model = "accounts/fireworks/models/minimax-m3"
task = "chat"
provider = "fireworks"

[models.embedding]
model = "accounts/fireworks/models/qwen3-embedding-8b"
task = "embedding"
provider = "fireworks"

[models.rerank]
model = "accounts/fireworks/models/qwen3-reranker-8b"
task = "rerank"
provider = "fireworks"

[models.image-generation]
model = "grok-imagine-image"
task = "image-generation"
provider = "xai"

[models.tts]
model = "speaches-ai/Kokoro-82M-v1.0-ONNX-fp16"
task = "tts"
provider = "speaches"

# [models.stt]
# model = "<provider-specific model name>"
# task = "stt"
# provider = "<name>"
