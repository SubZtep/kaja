# Kaja models — each model picks a [providers.*] table with `provider =
# "<name>"`; models that don't name one fall back to whichever provider has
# `default = true`. `model` is the literal name sent to the provider's API,
# and settings.json's models.<task> stores that model/provider pair directly
# (see the docs site). Provider API keys live in secrets.toml's
# [providers.<name>] tables, keyed the same way.

[providers.fireworks]
default = true
base_url = "https://api.fireworks.ai/inference/v1"

[providers.speaches]
base_url = "http://localhost:8000"  # local server, no key needed

[providers.xai]
base_url = "https://api.x.ai/v1"

[[models]]
model = "accounts/fireworks/models/minimax-m3"
task = "chat"

[[models]]
model = "accounts/fireworks/models/deepseek-v4-pro"
task = "chat"

[[models]]
model = "accounts/fireworks/models/kimi-k2p6"
task = "chat"

[[models]]
model = "accounts/fireworks/models/qwen3-embedding-8b"
task = "embedding"

[[models]]
model = "accounts/fireworks/models/qwen3-reranker-8b"
task = "rerank"

[[models]]
model = "grok-imagine-image"
task = "image-generation"
provider = "xai"

[[models]]
model = "speaches-ai/Kokoro-82M-v1.0-ONNX-fp16"
task = "text-to-speech"
provider = "speaches"
