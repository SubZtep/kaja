# The only file you should need to hand-edit for credentials. The provider
# and MCP tables mirror a table in models.toml or mcp.toml (same names, same
# keys) and are folded back into that file when it's loaded.

# Telegram bot token, for `kaja telegram`. Anyone who messages the bot can use it, so keep the token private.
# [telegram]
# botToken = "123456:ABC-DEF..."

# Credentials for models.toml's [providers.<name>] tables, keyed the same way.
# [providers.fireworks]
# api_key = "fw_YourSecretKey"

# [providers.xai]
# api_key = "xai-YourSecretTwitterKey"

# Credentials for mcp.toml's [[servers]] entries, keyed by server id. Values
# fold into that server's env (stdio) or headers (HTTP) by key name.
# [mcp.context7]
# CONTEXT7_API_KEY = "ctx7sk-..."

# API keys for HTTP tool abilities (marketplace/tools/<name>.toml), keyed by
# ability name. The ability's `auth` says which header or query parameter
# the key goes into.
# [abilities.brave-search]
# api_key = "BSA..."
