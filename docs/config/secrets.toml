# The only file you should need to hand-edit for credentials. Each section
# mirrors a section/table in services.toml, models.toml, or mcp.toml (same
# names, same keys) and is folded back into that file when it's loaded.

# Kaja server used by `kaja config fetch`; matches [api] baseUrl in
# services.toml. Can also be set via the CONFIG_API_TOKEN env var instead.
[api]
token = "kaja"

# Geo lookup for the location tool; matches [location] in services.toml.
[location]
apiKey = "kaja"

# Brave Search API key for the web_search tool.
# [webSearch]
# apiKey = "BSA..."

# Telegram bot token; matches [telegram] in services.toml.
# [telegram]
# botToken = "123456:ABC-DEF..."

# OpenCode Zen free models - https://opencode.ai/zen
# [zen]
# apiKey = "sk-..."

# Credentials for models.toml's [providers.<name>] tables, keyed the same way.
# [providers.fireworks]
# api_key = "fw_YourSecretKey"

# [providers.xai]
# api_key = "xai-YourSecretTwitterKey"

# Credentials for mcp.toml's [[servers]] entries, keyed by server id. Values
# fold into that server's env (stdio) or headers (HTTP) by key name.
[mcp.location]
Authorization = "Bearer guest"

# [mcp.context7]
# CONTEXT7_API_KEY = "ctx7sk-..."
