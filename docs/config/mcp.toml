# MCP servers available to Kaja, one [[servers]] entry each. Its tools are
# folded into the agent's toolset automatically — just add an entry, no code
# changes needed. Two server styles:
#   - local: spawned over stdio, needs `command` (+ optional `args`/`env`)
#   - remote: reached over Streamable HTTP, needs `url` (+ optional `headers`)

[[servers]]
id = "playwright"
command = "bunx"
args = ["@playwright/mcp@latest", "--isolated", "--headless"]

