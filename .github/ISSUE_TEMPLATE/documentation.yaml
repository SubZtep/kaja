name: Documentation
description: Suggest updates or additions to documentation.
title: "[Documentation]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this documentation request!

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: documentation-update
    attributes:
      label: Documentation Update
      description: What part of the documentation needs to be updated or added?
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: Why Is This Needed?
      description: Explain the importance of this update.
    validations:
      required: false

  - type: textarea
    id: suggested-changes
    attributes:
      label: Suggested Changes
      description: Provide a detailed description of the changes.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Include any related resources.
    validations:
      required: false
