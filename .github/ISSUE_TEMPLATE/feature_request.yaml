name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like to see?
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: Why Is This Needed?
      description: Explain the problem or need for this feature.
    validations:
      required: false

  - type: textarea
    id: suggested-solutions
    attributes:
      label: Suggested Solutions
      description: Describe how this feature could be implemented.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any relevant links or resources.
    validations:
      required: false

  - type: upload
    id: additional-screenshots
    attributes:
      label: Additional Screenshots
      description: Add any relevant screenshots or graphics.
    validations:
      required: false
