version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(gh): "

  # Base images in the Dockerfiles (node, bun, uv, …) — keeps FROM tags current
  # so Docker Scout stops flagging stale trixie layers between releases.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker): "

  # Every workspace's packages, from the root bun.lock
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(bun): "
    # A new release waits a few days before it's proposed, so a bad or compromised one can be yanked first
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
    # Packages released together move together; the rest share one PR per week for minor and patch bumps, while
    # each major gets its own PR
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      sentry:
        patterns: ["@sentry/*"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
