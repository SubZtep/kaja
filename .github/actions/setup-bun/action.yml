name: Setup Bun workspace
description: Install Bun and the workspace dependencies, with the Bun package cache

inputs:
  bun-version:
    description: Bun version (setup-bun's default when empty)
    default: ""
  paraglide:
    description: Generate the web's Paraglide messages after installing
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun i --frozen-lockfile --ignore-scripts

    - name: Generate Paraglide messages
      if: inputs.paraglide == 'true'
      shell: bash
      run: bun --filter @kaja/web generate:paraglide
