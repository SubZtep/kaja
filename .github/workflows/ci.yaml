name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: canary

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile --ignore-scripts

      - name: Setup Tombi
        uses: tombi-toml/setup-tombi@02117ea801cf3308a4b4260df55ea12ed0a6a92d # v1.9.4

      - name: Generate Paraglide messages
        run: bun --filter @kaja/web generate:paraglide

      - name: Lint
        run: bun lint

      - name: Check formatting
        run: bun fmt --check

      - name: Lint TOML
        run: tombi lint --error-on-warnings

      - name: Check TOML formatting
        run: tombi format --check

      - name: Check Tailwind classes are canonical
        run: |
          bun --filter @kaja/web tailwind:fix
          git diff --exit-code -- apps/web/src

  typecheck:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile --ignore-scripts

      - name: Generate Paraglide messages
        run: bun --filter @kaja/web generate:paraglide

      - name: Run type checker
        run: bun typecheck

  build:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile --ignore-scripts

      - name: Build API and its migrate script
        run: |
          bun --filter @kaja/api build
          bun build --minify --target bun --outfile apps/api/dist/migrate.js apps/api/migrate.ts

      - name: Build sandbox
        run: bun --filter @kaja/sandbox build

      - name: Build web
        env:
          NODE_ENV: production
        run: bun --filter @kaja/web build

  test:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/kaja
      BETTER_AUTH_SECRET: ci_better_auth_secret_at_least_32_chars_long
      CORS_ORIGIN: http://localhost:3000
      CONFIG_API_TOKEN: ci_config_api_token
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-start-period 3s
          --health-retries 5
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: kaja
          RUSTFS_SECRET_KEY: kaja-dev-storage
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health" --health-start-period 5s
          --health-retries 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile --ignore-scripts

      - name: Generate Paraglide messages
        run: bun --filter @kaja/web generate:paraglide

      - name: Check .env.example files are up to date
        run: bun check:env

      - name: Create the storage bucket
        run: |
          docker run --rm --network host -v "$PWD/scripts/storage_init.sh:/storage_init.sh:ro" \
            --entrypoint sh rustfs/rc:v0.1.36 /storage_init.sh

      - name: Migrate like a deploy
        run: bun apps/api/migrate.ts

      - name: Install secret-service backend
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: Run tests
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(echo 'ci-dummy-password' | gnome-keyring-daemon --unlock)"
          bun test

  locales:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Check every language is translated
        run: bun check:locales

  compile-tui:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun i --frozen-lockfile --ignore-scripts

      - name: Compile full TUI
        run: |
          cd apps/tui
          bun build cli.ts --compile --outfile kaja-check \
            --define process.env.KAJA_API_URL="\"https://api.kaja.io\""
