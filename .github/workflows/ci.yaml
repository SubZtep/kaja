name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to a PR supersedes its running checks; main's runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Biome and Tombi ship their binaries as optional dependencies, so no install scripts are needed
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run linter and formatter
        run: bunx biome ci .

      - name: Check TOML formatting and lint
        run: bunx tombi format --check && bunx tombi lint

  typecheck:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Paraglide messages
        run: bun run --filter @kaja/web generate:paraglide

      - name: Run type checker
        run: bun run typecheck

  # The same builds the Dockerfiles run, so a broken bundle fails here rather than at deploy
  build:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build API (with the widget) and its migrate script
        run: |
          bun run --filter @kaja/api build
          bun build --minify --target bun --outfile apps/api/dist/migrate.js apps/api/migrate.ts

      - name: Build sandbox
        run: bun run --filter @kaja/sandbox build

      - name: Build web
        env:
          NODE_ENV: production
        run: bun run --filter @kaja/web build

  test:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/kaja
      BETTER_AUTH_SECRET: ci_better_auth_secret_at_least_32_chars_long
      CORS_ORIGIN: http://localhost:3000
      CONFIG_API_TOKEN: ci_config_api_token
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-start-period 3s
          --health-retries 5
      # Object storage for images; credentials match apps/api/.env.example, and the tests create the bucket
      storage:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: kaja
          RUSTFS_SECRET_KEY: kaja-dev-storage
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health" --health-start-period 5s
          --health-retries 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Paraglide messages
        run: bun run --filter @kaja/web generate:paraglide

      - name: Check .env.example files are up to date
        run: bun run check:env

      - name: Check model example files are up to date
        run: bun run check:models

      # What a deploy runs: every migration, then the default config seed. The tests build their own database.
      - name: Migrate and seed like a deploy
        run: bun apps/api/migrate.ts

      - name: Install secret-service backend
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: Run tests
        run: |
          eval "$(dbus-launch --sh-syntax)"
          # a non-empty password is required for gnome-keyring-daemon to create the "login"
          # collection; empty/EOF stdin only creates the ephemeral "session" collection, which
          # Bun.secrets does not use, leaving Bun.secrets.set to fail against the CI runner's
          # otherwise-blank keyring state
          eval "$(echo 'ci-dummy-password' | gnome-keyring-daemon --unlock)"
          bun test

  locales:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      # Only Bun and Node built-ins, so no dependency install
      - name: Check every language is translated
        run: bun run check:locales

  compile-tui:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Compile full TUI
        run: |
          cd apps/tui
          bun build cli.ts --compile --outfile kaja-check \
            --define process.env.API_URL="\"https://api.kaja.io\""
