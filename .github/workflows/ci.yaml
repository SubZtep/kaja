name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun
        with:
          bun-version: canary
          paraglide: true

      - name: Setup Tombi
        uses: tombi-toml/setup-tombi@4039f278ab5f7cf5140af99e46986b412fc672ca # v1.9.5

      - name: Lint
        run: bun lint

      - name: Check formatting
        run: bun fmt --check

      - name: Lint TOML
        run: tombi lint --error-on-warnings

      - name: Check TOML formatting
        run: tombi format --check

      - name: Check Tailwind classes are canonical
        run: |
          bun --filter @kaja/web tailwind:fix
          git diff --exit-code -- apps/web/src

  typecheck:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun
        with:
          paraglide: true

      - name: Run type checker
        run: bun typecheck

  build:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Build API and its migrate script
        run: |
          bun --filter @kaja/api build
          bun build --minify --target bun --outfile apps/api/dist/migrate.js apps/api/scripts/migrate.ts

      - name: Build sandbox
        run: bun --filter @kaja/sandbox build

      - name: Build web
        env:
          NODE_ENV: production
        run: bun --filter @kaja/web build

  test:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Shell and process tests can hang in CI (dash), not burn the 6-hour default
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/kaja
      BETTER_AUTH_SECRET: ci_better_auth_secret_at_least_32_chars_long
      CORS_ORIGIN: http://localhost:3000
      CONFIG_API_TOKEN: ci_config_api_token
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-start-period 3s
          --health-retries 5
      storage:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: kaja
          RUSTFS_SECRET_KEY: kaja-dev-storage
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health" --health-start-period 5s
          --health-retries 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun
        with:
          paraglide: true

      - name: Check .env.example files are up to date
        run: bun check:env

      - name: Create the storage bucket
        run: |
          docker run --rm --network host -v "$PWD/scripts/storage_init.sh:/storage_init.sh:ro" \
            --entrypoint sh rustfs/rc:v0.1.36 /storage_init.sh

      - name: Migrate like a deploy
        run: bun apps/api/scripts/migrate.ts

      - name: Install secret-service backend
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: Run tests
        run: |
          eval "$(dbus-launch --sh-syntax)"
          eval "$(echo 'ci-dummy-password' | gnome-keyring-daemon --unlock)"
          bun test

  locales:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check every language is translated
        run: bun check:locales

  compile-tui:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Compile full TUI
        run: |
          cd apps/tui
          bun build cli.ts --compile --outfile kaja-check \
            --define process.env.KAJA_API_URL="\"https://api.kaja.io\""
