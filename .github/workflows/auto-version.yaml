name: Automatic Versioning

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"

permissions:
  contents: write

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check changed workspaces
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            api:
              - 'apps/api/**'
            cli:
              - 'apps/cli/**'
            web:
              - 'apps/web/**'

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Smart Bump API
        if: steps.filter.outputs.api == 'true'
        run: |
          cd apps/api

          # Scan all commit messages in this specific push
          COMMIT_MSGS=$(git log origin/main..HEAD --pretty=%B)
          BUMP_TYPE="patch" # Default fallback

          if [[ "$COMMIT_MSGS" == *"BREAKING CHANGE"* || "$COMMIT_MSGS" == *"\!"* ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSGS" == *"feat"* ]]; then
            BUMP_TYPE="minor"
          fi

          echo "Determined bump type for API: $BUMP_TYPE"

          npm version $BUMP_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          # Commit back with [skip ci] to prevent infinite loops
          git add package.json
          git commit -m "chore(api): auto $BUMP_TYPE bump to $NEW_VERSION [skip ci]"
          git tag "api@$NEW_VERSION"

          # Pull latest changes to avoid conflicts, then push code and tag
          git pull origin main --rebase
          git push origin main --tags

      - name: Smart Bump CLI
        if: steps.filter.outputs.cli == 'true'
        run: |
          cd apps/cli

          COMMIT_MSGS=$(git log origin/main..HEAD --pretty=%B)
          BUMP_TYPE="patch"

          if [[ "$COMMIT_MSGS" == *"BREAKING CHANGE"* || "$COMMIT_MSGS" == *"\!"* ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSGS" == *"feat"* ]]; then
            BUMP_TYPE="minor"
          fi

          echo "Determined bump type for CLI: $BUMP_TYPE"

          npm version $BUMP_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          git add package.json
          git commit -m "chore(cli): auto $BUMP_TYPE bump to $NEW_VERSION [skip ci]"
          git tag "cli@$NEW_VERSION"

          git pull origin main --rebase
          git push origin main --tags

      - name: Smart Bump Web
        if: steps.filter.outputs.web == 'true'
        run: |
          cd apps/web

          COMMIT_MSGS=$(git log origin/main..HEAD --pretty=%B)
          BUMP_TYPE="patch"

          if [[ "$COMMIT_MSGS" == *"BREAKING CHANGE"* || "$COMMIT_MSGS" == *"\!"* ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSGS" == *"feat"* ]]; then
            BUMP_TYPE="minor"
          fi

          echo "Determined bump type for Web: $BUMP_TYPE"

          npm version $BUMP_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          git add package.json
          git commit -m "chore(web): auto $BUMP_TYPE bump to $NEW_VERSION [skip ci]"
          git tag "cli@$NEW_VERSION"

          git pull origin main --rebase
          git push origin main --tags
