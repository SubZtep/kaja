name: Automatic Versioning

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: write
  # So we can `gh workflow run` Build and release CLI after a CLI bump
  # (tag pushes alone are skipped by [skip ci] on the bump commit).
  actions: write

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Check changed workspaces
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: |
            api:
              - 'apps/api/**'
            cli:
              - 'apps/cli/**'
            web:
              - 'apps/web/**'
            shared:
              - 'packages/shared/**'
            logger:
              - 'packages/logger/**'
            sdk:
              - 'packages/sdk/**'
            schema:
              - 'packages/schema/**'

      - name: Setup Git
        if: steps.filter.outputs.api == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.logger == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.schema == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, tag, and push once
        id: bump
        if: steps.filter.outputs.api == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.logger == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.schema == 'true'
        env:
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_CLI: ${{ steps.filter.outputs.cli }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_SHARED: ${{ steps.filter.outputs.shared }}
          FILTER_LOGGER: ${{ steps.filter.outputs.logger }}
          FILTER_SDK: ${{ steps.filter.outputs.sdk }}
          FILTER_SCHEMA: ${{ steps.filter.outputs.schema }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          echo "cli_bumped=false" >> "$GITHUB_OUTPUT"

          # Commit messages for this push (not origin/main..HEAD, which is empty after checkout)
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            COMMIT_MSGS=$(git log "${BEFORE_SHA}..HEAD" --pretty=%B)
          else
            COMMIT_MSGS=$(git log -1 --pretty=%B)
          fi

          bump_type() {
            local msgs="$1"
            if [[ "$msgs" == *"BREAKING CHANGE"* || "$msgs" == *"!"* ]]; then
              echo "major"
            elif [[ "$msgs" == *"feat"* ]]; then
              echo "minor"
            else
              echo "patch"
            fi
          }

          BUMP_TYPE=$(bump_type "$COMMIT_MSGS")
          echo "Determined bump type: $BUMP_TYPE"
          echo "Commit messages:"
          echo "$COMMIT_MSGS"

          SUMMARY_PARTS=()
          TAGS=()

          bump_workspace() {
            local name="$1"
            local dir="$2"
            (
              cd "$dir"
              bun pm version "$BUMP_TYPE" --no-git-tag-version
            )
            local version
            version=$(bun -e "console.log(require('./${dir}/package.json').version)")
            git add "${dir}/package.json"
            SUMMARY_PARTS+=("${name}@${version} (${BUMP_TYPE})")
            TAGS+=("${name}@${version}")
            echo "Bumped ${name} → ${version} (${BUMP_TYPE})"
          }

          if [[ "$FILTER_API" == "true" ]]; then
            bump_workspace "api" "apps/api"
          fi
          if [[ "$FILTER_CLI" == "true" ]]; then
            bump_workspace "cli" "apps/cli"
            echo "cli_bumped=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$FILTER_WEB" == "true" ]]; then
            bump_workspace "web" "apps/web"
          fi
          if [[ "$FILTER_SHARED" == "true" ]]; then
            bump_workspace "shared" "packages/shared"
          fi
          if [[ "$FILTER_LOGGER" == "true" ]]; then
            bump_workspace "logger" "packages/logger"
          fi
          if [[ "$FILTER_SDK" == "true" ]]; then
            bump_workspace "sdk" "packages/sdk"
          fi
          if [[ "$FILTER_SCHEMA" == "true" ]]; then
            bump_workspace "schema" "packages/schema"
          fi

          if [[ ${#SUMMARY_PARTS[@]} -eq 0 ]]; then
            echo "No workspaces to bump"
            exit 0
          fi

          SUMMARY=$(IFS=", "; echo "${SUMMARY_PARTS[*]}")
          # [skip ci] avoids re-running CI / this workflow on the bump commit.
          # Tag push alone will not start Build and release CLI either — we
          # dispatch that workflow explicitly below when the CLI was bumped.
          git commit -m "chore: auto bump ${SUMMARY} [skip ci]"

          for tag in "${TAGS[@]}"; do
            git tag "$tag"
            echo "Created tag ${tag}"
          done

          # GITHUB_TOKEN is enough: we no longer rely on the tag push to chain
          # into other workflows (that required a PAT, and still failed with [skip ci]).
          git pull origin main --rebase
          git push origin main --tags

      - name: Trigger CLI release build
        if: steps.bump.outputs.cli_bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "CLI was bumped — dispatching Build and release CLI on main"
          gh workflow run "Build and release CLI" --ref main
