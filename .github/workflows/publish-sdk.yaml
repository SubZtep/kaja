name: Publish SDK to GitHub Packages

on:
  push:
    tags:
      - "sdk@*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@kaja"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Determine version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r .version packages/sdk/package.json)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "sdk@${PACKAGE_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/sdk/package.json version sdk@${PACKAGE_VERSION}"
            exit 1
          fi
          echo "version=sdk@${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build SDK
        run: bun run --filter @kaja/sdk build

      - name: Point package entry fields at dist
        working-directory: packages/sdk
        run: |
          jq '.main = "./dist/index.js" | .types = "./dist/index.d.ts"' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Publish to GitHub Packages
        working-directory: packages/sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
