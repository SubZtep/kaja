name: Docker Scout

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/sandbox/**
      - packages/**
      - patches/**
      - bun.lock
      - marketplace/abilities/**
      - .github/workflows/scout.yaml
      - .github/workflows/dockerhub.yaml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox:
    name: Sandbox Image
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built like the release (SubZtep/dockerhub-action in dockerhub.yaml), so the compare shows only real changes
      - name: Build the sandbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/sandbox/Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/sandbox,tar=false,name=kaja-sandbox:pr
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sandbox

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compare with the released sandbox
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: compare
          image: oci-dir://${{ runner.temp }}/sandbox
          to: registry://${{ vars.DOCKER_IMAGE_SANDBOX || 'subztep/kaja-sandbox' }}:latest
          ignore-unchanged: true
          only-severities: critical,high
          github-token: ${{ secrets.GITHUB_TOKEN }}
          write-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Scout the sandbox
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: quickview,cves
          image: oci-dir://${{ runner.temp }}/sandbox
          only-severities: critical,high
          write-comment: false

  released:
    name: Released Sandbox
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Fails (and emails) only when a fix exists, so an unfixed Debian CVE doesn't keep it red
      - name: Scout the released sandbox
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: quickview,cves
          image: registry://${{ vars.DOCKER_IMAGE_SANDBOX || 'subztep/kaja-sandbox' }}:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          write-comment: false
