name: Docker Scout

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/sandbox/**
      - packages/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox:
    name: Sandbox Image
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The docker driver can't attach attestations; the container driver can
      - name: Set up Buildx
        run: docker buildx create --use --driver docker-container

      # Provenance and an SBOM like the release build, so Scout doesn't count them missing
      - name: Build the sandbox image
        run: >-
          docker buildx build --file apps/sandbox/Dockerfile
          --provenance=mode=max --sbom=true
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --output type=oci,dest=${{ runner.temp }}/sandbox,tar=false .

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compare with the released sandbox
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: compare
          image: oci-dir://${{ runner.temp }}/sandbox
          to: registry://${{ vars.DOCKER_IMAGE_SANDBOX || 'subztep/kaja-sandbox' }}:latest
          ignore-unchanged: true
          only-severities: critical,high
          github-token: ${{ secrets.GITHUB_TOKEN }}
          write-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Scout the sandbox
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: quickview,cves
          image: oci-dir://${{ runner.temp }}/sandbox
          only-severities: critical,high
          write-comment: false
