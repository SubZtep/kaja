name: Release api/web

# Creates a changelog-only GitHub Release (no build artifacts — api/web are
# deployed services, not distributables) for a tag auto-version.yaml created.
#
# Triggered via workflow_dispatch from auto-version.yaml, not by the tag push
# itself — the bump commit carries [skip ci], which suppresses tag-push
# triggers too (see build-tui.yaml for the same workaround).
#
# Marked prerelease so these never win GitHub's releases/latest — that alias
# must keep resolving to the most recent tui@ release, which install.sh relies
# on for its manifest.json download.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Workspace name (api or web)"
        required: true
      tag:
        description: "Tag to release, e.g. api@1.2.3"
        required: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          APP_NAME: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git tag --list "${APP_NAME}@*" --sort=-v:refname | grep -v "^${TAG}\$" | head -n1)
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          "${GITHUB_WORKSPACE}/.github/scripts/changelog.sh" "$RANGE" > changelog.md
          cat changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: true
          body_path: changelog.md
