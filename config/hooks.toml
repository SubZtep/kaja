# Optional: Kaja works without this file. `kaja config hooks` (also a step of the setup wizard) looks for a sound
# player, a notification tool and a speech tool on this computer and writes it for you.
#
# Each [[event]] below starts one shell command in the background (Kaja never waits for it) when that happens in the
# chat. Several [[event]] tables of the same name run side by side. In the command:
#   $KAJA_TEXT    what happened as plain text (no Markdown); also on the command's stdin
#   $KAJA_TITLE   a short title, for notifications
#   $KAJA_SOUNDS  the folder of sound effects `kaja config hooks` downloads (bell.wav, magic.wav, wind.wav, hehe.wav,
#                 error.wav, keyboard.wav)
#   $KAJA_LOCALE  the language Kaja runs in (preferences.locale in settings.toml, e.g. hu-HU), for speech tools
#   $KAJA_HOOK    the event's name
#
# Events: message, question, confirm, reasoning, tool_call, notice, persona_switch, error, copy, login_code.
#
# `cancel` stops the still-running previous run before this one starts: true for a run of this same command, or a name
# shared by several commands, so they never talk over each other.

# The assistant wrote something in the chat. Read it aloud, cutting off the previous reply:
# [[message]]
# run = 'espeak-ng -v "$KAJA_LOCALE" --stdin'
# cancel = "speech"

# A sound as well:
# [[message]]
# run = 'paplay "$KAJA_SOUNDS/hehe.wav"'

# Kaja asks you a question. Show a desktop notification:
# [[question]]
# run = 'notify-send -- "$KAJA_TITLE" "$KAJA_TEXT"'
