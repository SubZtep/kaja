# SonarQube Project Configuration
sonar.projectKey=kaja
sonar.projectName=Kaja

# Suppress false positive warnings
sonar.issue.ignore.multicriteria=e1,e2

# Suppress S6504 (Docker COPY permissions warning)
# Both Dockerfiles use --chmod=555 which removes write permissions,
# so these warnings are false positives
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/api/Dockerfile

sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/web/Dockerfile
