services:
  db:
    image: postgres:18.4-alpine
    ports:
      - "5433:5432"
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kaja
    volumes:
      - ./pgdata:/var/lib/postgresql
      - ./apps/api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testuser", "-d", "postgres"]
      start_period: 3s

  mail:
    image: maildev/maildev:2.2.1
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025" # expose SMTP to host
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:1080",
        ]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    env_file:
      - path: apps/api/.env.example
        required: true
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://testuser:testpass@db:5432/kaja
      SMTP_HOST: mail
      NASI_DATA_DIR: /var/lib/kaja/nasi
    volumes:
      - nasi-data:/var/lib/kaja/nasi

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - path: apps/web/.env.example
        required: true
      - path: apps/web/.env
        required: false
    environment:
      API_URL: http://api:3001

  openai:
    build:
      context: .
      dockerfile: apps/openai/Dockerfile
    ports:
      - "6669:6669"
    depends_on:
      - api
    env_file:
      - path: apps/openai/.env.example
        required: true
      - path: apps/openai/.env
        required: false
    environment:
      KAJA_API_URL: http://api:3001

volumes:
  nasi-data:
