services:
  db:
    image: postgres:18.6-alpine
    ports:
      - "5433:5432"
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kaja
    volumes:
      - ./pgdata:/var/lib/postgresql
      - ./apps/api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testuser", "-d", "postgres"]
      start_period: 3s

  mail:
    image: maildev/maildev:3.0.0-rc.3
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025" # expose SMTP to host
    environment:
      MAILDEV_MCP: 1
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:1080/index.html",
        ]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    env_file:
      - path: apps/api/.env.example
        required: true
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://testuser:testpass@db:5432/kaja
      SMTP_HOST: mail
      CORS_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: compose_dev_better_auth_secret_not_for_production # local stack only
      SANDBOX_URL: http://sandbox:3002
      SANDBOX_SECRET: compose_dev_sandbox_secret_not_for_production # local stack only
    networks:
      - default
      - sandbox

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - path: apps/web/.env.example
        required: true
      - path: apps/web/.env
        required: false
    environment:
      API_URL: http://api:3001

  # Runs stdio MCP servers (a headless Chrome among them) for cloud turns. Only the api shares its network, so it can't
  # reach db or mail by name; it can still reach ports published on the host, so production needs egress rules too.
  sandbox:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
    ports:
      - "3002:3002"
    shm_size: 1gb
    env_file:
      - path: apps/sandbox/.env.example
        required: true
      - path: apps/sandbox/.env
        required: false
    environment:
      SANDBOX_SECRET: compose_dev_sandbox_secret_not_for_production # local stack only
    networks:
      - sandbox

networks:
  sandbox:
