services:
  db:
    image: postgres:18.6-alpine3.24
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kaja
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./apps/api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testuser", "-d", "postgres"]
      start_period: 3s

  mail:
    image: maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025" # expose SMTP to host
    environment:
      MAILDEV_MCP: 1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:1080/index.html"]
      timeout: 5s

  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: kaja # matches apps/api/.env.example
      RUSTFS_SECRET_KEY: kaja-dev-storage
    volumes:
      - ./data/storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
      storage:
        condition: service_healthy
    env_file:
      - path: apps/api/.env.example
        required: true
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://testuser:testpass@db:5432/kaja
      SMTP_HOST: mail
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      SANDBOX_SYSTEM_KEY: compose_dev_sandbox_system_key_not_for_production
      NODE_ENV: development
    networks:
      - default
      - sandbox
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3001/health')).ok ? 0 : 1)"]
      timeout: 5s
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: apps/web/.env.example
        required: true
      - path: apps/web/.env
        required: false
    environment:
      API_URL: http://api:3001
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/')).ok ? 0 : 1)"]
      timeout: 5s
      start_period: 10s

  sandbox:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    shm_size: 1gb
    env_file:
      - path: apps/sandbox/.env.example
        required: true
      - path: apps/sandbox/.env
        required: false
    environment:
      KAJA_API_URL: http://api:3001
      KAJA_SANDBOX_KEY: compose_dev_sandbox_system_key_not_for_production # local stack only: the api's SANDBOX_SYSTEM_KEY
      MARKETPLACE_DIR: /home/node/app/marketplace
      SANDBOX_OVERRIDES: /home/node/app/overrides.json
      SANDBOX_CACHE_DIR: /home/node/.cache/mcp
      SANDBOX_STATE_DIR: /data
    volumes:
      - ./data/sandbox:/data
    networks:
      - sandbox

networks:
  sandbox:
