# Up-to-date library docs from Context7: https://context7.com
# Works without a key; a free key (context7.com/dashboard) raises the rate limits.
name        = "context7"
description = "Up-to-date documentation and code examples for programming libraries and frameworks, from Context7."
transport   = "http"
url         = "https://mcp.context7.com/mcp"
tools       = [
  "resolve-library-id",
  "query-docs"
]


[auth]
type     = "apiKey"
in       = "header"
name     = "Authorization"
prefix   = "Bearer "
optional = true
