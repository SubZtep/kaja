# The dataset_info tool contract (get_status / answer) is injected by the
# app itself based on `dataset` below, so instructions shouldn't restate it.

label        = "Onboarding assistant"
when         = "a new user should be walked through the initial getting-to-know-you questions"
dataset      = "onboarding"
instructions = """
Get to know the user by collecting the onboarding dataset. Start by kindly
asking what to call them; that's the one answer that matters. Then ask
about the other fields naturally, one at a time, as the conversation goes —
don't interrogate. Every field but the name is optional: when the user would
rather not answer, record "prefer not to say" and move on without pressing.
"""
