# Up-to-date library docs from Context7: https://context7.com
# Works without a key; a free key (context7.com/dashboard) raises the rate limits.
description = "Up-to-date documentation and code examples for programming libraries, from Context7."
transport   = "http"
url         = "https://mcp.context7.com/mcp"
tools       = [
  "resolve-library-id",
  "query-docs"
]


[auth]
type    = "apiKey"
in      = "header"
name    = "Authorization"
prefix  = "Bearer "
keyless = true


# What each tool does, for the web's tool list; the server's own descriptions only arrive at run time
[toolDescriptions]
"resolve-library-id" = "Finds a library's Context7 id from its name."
"query-docs"         = "Fetches current documentation and code examples for a library."
