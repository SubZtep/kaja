# Current time and time zone conversion: https://github.com/modelcontextprotocol/servers/tree/main/src/time
# Runs `uvx mcp-server-time` on your machine and needs uv (https://docs.astral.sh/uv/) installed.
# In the cloud it runs in the MCP sandbox instead (apps/sandbox). Both tools only read, so nothing asks first.
description = "The current time in any IANA time zone, and converting times between zones."
transport   = "stdio"
command     = "uvx"
args        = [
  "mcp-server-time"
]
tools       = [
  "get_current_time",
  "convert_time"
]


# What each tool does, for the web's tool list; the server's own descriptions only arrive at run time
[toolDescriptions]
get_current_time = "The current time in a time zone."
convert_time     = "Converts a time from one time zone to another."
