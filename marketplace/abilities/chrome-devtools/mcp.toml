# Drives a headless Chrome through the Chrome DevTools MCP server:
# https://github.com/ChromeDevTools/chrome-devtools-mcp
# Runs `bunx chrome-devtools-mcp@latest` on your machine and needs Chrome installed.
# In the cloud it runs in the MCP sandbox instead (apps/sandbox), one browser per user,
# and only on that user's own sandbox or the official one — never one somebody else shares.
# Reading pages runs straight away; clicking, typing and navigating ask first.
# Snapshots and screenshots count as reads too, unless they're asked to save a file.
description    = "Browse web pages in a headless Chrome: read, screenshot, and click or type with your approval."
transport      = "stdio"
command        = "bunx"
args           = [
  "chrome-devtools-mcp@latest",
  "--headless",
  "--isolated"
]
approval       = "writes"
# Pages and anything typed into them stay off a sandbox another person runs.
trustedSandbox = true
tools          = [
  "new_page",
  "navigate_page",
  "list_pages",
  "select_page",
  "take_snapshot",
  "take_screenshot",
  "wait_for",
  "click",
  "fill",
  "press_key",
  "list_console_messages",
  "list_network_requests",
]
# The cloud can't hand back a file saved in its sandbox, so it hides filePath: screenshots come back inline instead.
localOnlyArgs  = [
  "filePath"
]
# The server doesn't mark these read-only, but they only look at the page unless given a filePath to write.


[[readOnly]]
tool   = "take_snapshot"
unless = [
  "filePath"
]


[[readOnly]]
tool   = "take_screenshot"
unless = [
  "filePath"
]


# What each tool does, for the web's tool list; the server's own descriptions only arrive at run time
[toolDescriptions]
new_page              = "Opens a new tab at a web address."
navigate_page         = "Goes to an address, or back, forward or reload, in the current tab."
list_pages            = "Lists the open tabs."
select_page           = "Switches to another open tab."
take_snapshot         = "Reads the page as text, with an id for each thing it can click or fill in."
take_screenshot       = "Takes a picture of the page, or of one part of it."
wait_for              = "Waits until some text shows up on the page."
click                 = "Clicks a button, link or other element."
fill                  = "Types into a field, or picks an option in a list."
press_key             = "Presses a key or a shortcut."
list_console_messages = "Lists the page's console messages, such as errors."
list_network_requests = "Lists the requests the page made."
