[commit-msg]
commands = { commitlint = { run = "bun commitlint --edit {1}" } }

[pre-commit]
parallel = true

[[pre-commit.jobs]]
run = "bun lint:fix"
stage_fixed = true

[[pre-commit.jobs]]
run = "bun run --filter @kaja/cli gen-schema"
glob = ["apps/cli/schemas/config.ts"]
stage_fixed = true

[[pre-commit.jobs]]
run = "bun typecheck"

[pre-push]
[[pre-push.jobs]]
run = "bun test"
