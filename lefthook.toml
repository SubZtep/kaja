[commit-msg]
commands = { commitlint = { run = "bun commitlint --edit {1}" } }

[pre-commit]
parallel = true

[[pre-commit.jobs]]
run = "bun lint:fix"
stage_fixed = true

[[pre-commit.jobs]]
run = "bun --filter @kaja/schema gen-json"
glob = ["package/schema/config/settings.ts"]
stage_fixed = true

[[pre-commit.jobs]]
run = "bun typecheck"
glob = ["*.ts", "*.tsx"]

[pre-push]
parallel = true

[[pre-push.jobs]]
run = "bun lint"

[[pre-push.jobs]]
run = "bun typecheck"
glob = ["*.ts", "*.tsx"]

[[pre-push.jobs]]
run = "bun test"
